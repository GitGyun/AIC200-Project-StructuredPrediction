# Fine-tuning config for a student-defined task (--dataset custom).
# Every value here can be overridden from the notebook, e.g. build_config(..., lr=0.0005).

# environment settings
seed: 0
precision: fp32          # T4 (Turing) has no bfloat16; see the notebook's Step 1
strategy: ddp
num_nodes: 1

# data arguments
dataset: custom
task: custom
class_wise: False
class_name: none
# n_tasks (the number of channels in your label tensor Y) is deliberately not set here: pass
# --n_tasks, or it is taken from register_custom(n_tasks=...). A default here would override both.
shot: 20                 # how many labelled images form the support set
img_size: 224            # must stay 224 unless you also change the encoder name
base_size: 256
vis_size: 256
support_idx: 0
autocrop: False
autocrop_minoverlap: 0.5

# dataloader arguments
num_workers: 2
eval_shot: 20
eval_batch_size: 4
eval_size: 20
chunk_size: 1
channel_chunk_size: 1

# model arguments
attn_dropout: 0.5
n_input_images: 1
separate_alpha: False

# training arguments
n_schedule_steps: -1
optimizer: adam
loss_type: bce           # bce | l2 | ssl -- see downstream/custom/learner.py
mask_value: -1.
early_stopping_patience: -1
monitor: IoU_inverted

# learning rate arguments
lr: 0.001
lr_pretrained: 0.0002
lr_schedule: constant
lr_warmup: 0
lr_warmup_scale: 0.
schedule_from: 0
weight_decay: 0.
lr_decay_degree: 0.9

# parameter arguments
from_scratch: False
head_tuning: False
label_decoder_tuning: False
input_embed_tuning: False
output_embed_tuning: False
relpos_tuning: False

# logging arguments
log_dir: TEST_CUSTOM
save_dir: FINETUNE_CUSTOM
load_dir: TRAIN
load_step: 400000
load_path: none
result_dir: none
